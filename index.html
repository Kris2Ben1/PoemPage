<h1 style="color:#ACAD94; text-align: center;">Nothing Gold Can Stay</h1>

<h2 style="color:#ACAD94; text-align: center;">By Robert Frost</h2>

<p style="color:#ACAD94; text-align: center;"><em>"Nature's first green is gold,<br/>Her hardest hue to hold.</em></p>
<p style="color:#ACAD94; text-align: center;"><em>Her early leaf's a flower;<br/>But only so an hour.</em></p>
<p style="color:#ACAD94; text-align: center;"><em>Then leaf subsides to leaf.<br/>So Eden sank to grief,</em></p>
<p style="color:#ACAD94; text-align: center;"><em>So dawn goes down to day.<br/>Nothing gold can stay.</em></p>
